[project]
name = "momentum-trader"
version = "0.1.0"
description = "Django app for a 12-1 momentum strategy: Massive market data, Alpaca paper execution, backtests."
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
